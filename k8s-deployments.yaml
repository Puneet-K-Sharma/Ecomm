apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-vault-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-vault
  template:
    metadata:
      labels:
        app: stream-vault
    spec:
      containers:
      - name: stream-vault-cnt
        image: aksacr1.azurecr.io/vault-service:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: stream-config
        env:
        - name: STORAGE_PATH
          value: /mnt/personal-vault
        ports:
        - containerPort: 8009
        volumeMounts:
        - name: vault-storage
          mountPath: /mnt/personal-vault
        startupProbe:
          httpGet:
            path: /health
            port: 8009
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8009
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8009
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
      volumes:
      - name: vault-storage
        persistentVolumeClaim:
          claimName: vault-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
spec:
  selector:
    app: stream-vault
  ports:
  - protocol: TCP
    port: 8009
    targetPort: 8009
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-ui-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-ui
  template:
    metadata:
      labels:
        app: stream-ui
    spec:
      containers:
      - name: stream-ui-cnt
        image: aksacr1.azurecr.io/frontend:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: stream-ui-svc
spec:
  selector:
    app: stream-ui
  ports:
  - port: 80
    name: http
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stream-ui-ing
spec:
  ingressClassName: azure-application-gateway
  rules:
  - host: jpshop.puneetdevops.online
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: stream-ui-svc
            port:
              number: 80
  - host: api.puneetdevops.online
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: stream-api-svc
            port:
              number: 80
---
