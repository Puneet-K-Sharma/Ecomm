apiVersion: v1
kind: ConfigMap
metadata:
  name: stream-config
data:
  DBURL: "Driver={ODBC Driver 18 for SQL Server};Server=tcp:admindb123.database.windows.net,1433;Database=admindb123;Uid=admindb123;Pwd=StrongPass123!;Encrypt=yes;TrustServerCertificate=no;Connection Timeout=30;"
  JWT_ALGORITHM: "HS256"
  APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=76ed93b5-4511-45f0-bb5f-5f0846720312;IngestionEndpoint=https://centralindia-0.in.applicationinsights.azure.com/;LiveEndpoint=https://centralindia.livediagnostics.monitor.azure.com/;ApplicationId=f3c8463c-d797-495e-b222-b5439f8fc7e5"
  VITE_API_HOST: "https://api.puneetdevops.online"

---

apiVersion: v1
kind: Secret
metadata:
  name: stream-secret
type: Opaque
data:
  JWT_SECRET_KEY: c3VwZXJzZWNyZXRrZXkxMjM=

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 5Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-ui-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-ui
  template:
    metadata:
      labels:
        app: stream-ui
    spec:
      containers:
      - name: stream-ui-cnt
        image: aksacr1.azurecr.io/frontend:latest
        imagePullPolicy: Always
        env:
        - name: VITE_API_HOST
          value: "https://api.puneetdevops.online"
        - name: VITE_APP_MODE
          value: "production"
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stream-ui-svc
spec:
  selector:
    app: stream-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP