apiVersion: v1
kind: ConfigMap
metadata:
  name: stream-config
data:
  DB_SERVER: "msqlsvc.database.windows.net"
  DB_NAME: "TestCase"
  DB_PORT: "1433"
  DB_USER: "dbadmin"
  DB_PASSWORD: "StrongPass123!"
  JWT_ALGORITHM: "HS256"
  APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=76ed93b5-4511-45f0-bb5f-5f0846720312;IngestionEndpoint=https://centralindia-0.in.applicationinsights.azure.com/;LiveEndpoint=https://centralindia.livediagnostics.monitor.azure.com/;ApplicationId=f3c8463c-d797-495e-b222-b5439f8fc7e5"

---

apiVersion: v1
kind: Secret
metadata:
  name: stream-secret
type: Opaque
data:
  # Base64 encoded values (default: supersecretkey123 for JWT)
  JWT_SECRET_KEY: c3VwZXJzZWNyZXRrZXkxMjM=

---

# Persistent Volume Claim for Vault storage using Azure Files
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 5Gi

---

# 1. Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-auth-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-auth
  template:
    metadata:
      labels:
        app: stream-auth
    spec:
      containers:
      - name: stream-auth-cnt
        image: aksacr1.azurecr.io/auth-service:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: stream-config
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stream-secret
              key: JWT_SECRET_KEY
        ports:
        - containerPort: 8001
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: stream-auth
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP

---

