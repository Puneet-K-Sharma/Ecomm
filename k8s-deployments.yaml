# 9. Vault Service (Storage Integration)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-vault-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-vault
  template:
    metadata:
      labels:
        app: stream-vault
    spec:
      containers:
      - name: stream-vault-cnt
        image: aksacr1.azurecr.io/vault-service:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: stream-config
        env:
        - name: STORAGE_PATH
          value: "/mnt/personal-vault"
        ports:
        - containerPort: 8009
        volumeMounts:
        - name: vault-storage
          mountPath: /mnt/personal-vault
        livenessProbe:
          httpGet:
            path: /health
            port: 8009
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8009
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: vault-storage
        persistentVolumeClaim:
          claimName: vault-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
spec:
  selector:
    app: stream-vault
  ports:
    - protocol: TCP
      port: 8009
      targetPort: 8009
  type: ClusterIP

---

# 10. React Frontend (Web UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-ui-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-ui
  template:
    metadata:
      labels:
        app: stream-ui
    spec:
      containers:
      - name: stream-ui-cnt
        image: aksacr1.azurecr.io/frontend:latest
        imagePullPolicy: Always
        env:
        # Pass the Azure APIM Endpoint as the API Host
        - name: VITE_API_HOST
          value: "https://streamshop-apim.azure-api.net"
        - name: VITE_APP_MODE
          value: "production"
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stream-ui-svc
spec:
  selector:
    app: stream-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
