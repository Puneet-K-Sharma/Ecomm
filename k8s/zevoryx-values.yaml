# OpenTelemetry Collector Configuration for Zevoryx
# Pinned to opentelemetry-collector-k8s distro
image:
  repository: otel/opentelemetry-collector-k8s
  tag: "0.153.0"

mode: daemonset

# Chart presets
presets:
  logsCollection:
    enabled: true
  hostMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true

clusterRole:
  rules:
    - apiGroups: ['']
      resources: ['nodes/stats', 'nodes/proxy']
      verbs: ['get']

config:
  receivers:
    kubelet_stats:
      collection_interval: 20s
      auth_type: serviceAccount
      endpoint: "https://${env:OTEL_K8S_NODE_NAME}:10250"
      insecure_skip_verify: true
      metric_groups: [node, pod, container]

  processors:
    resourcedetection:
      detectors:
        - env
        - system
        - azure

  exporters:
    otlphttp:
      endpoint: "https://oxford-permanent-var-sunrise.trycloudflare.com"

  service:
    pipelines:
      logs:
        receivers:
          - file_log
        processors:
          - k8s_attributes
          - resourcedetection
          - batch
        exporters:
          - otlphttp
      metrics:
        receivers:
          - hostmetrics
          - kubelet_stats
        processors:
          - resourcedetection
          - batch
        exporters:
          - otlphttp
      traces:
        receivers:
          - otlp
        processors:
          - resourcedetection
          - batch
        exporters:
          - otlphttp
