# Run this command to generate this secret automatically:
# kubectl create secret docker-registry acr-secret \
#   --namespace ecomm \
#   --docker-server=acraksarc1.azurecr.io \
#   --docker-username=acraksarc1 \
#   --docker-password="<YOUR_ACR_PASSWORD>"

apiVersion: v1
kind: Secret
metadata:
  name: acr-secret
  namespace: ecomm
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded docker config json
  .dockerconfigjson: ""

